x-log-policy: &log-policy
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-security: &app-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  logging: *log-policy

services:
  postgres:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 1g
    cpus: 1.5
    logging: *log-policy

  migrations:
    <<: *app-security
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0

  web:
    <<: *app-security
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.5

  worker:
    <<: *app-security
    pids_limit: 200
    mem_limit: 1g
    cpus: 2.0

  caddy:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    logging: *log-policy
